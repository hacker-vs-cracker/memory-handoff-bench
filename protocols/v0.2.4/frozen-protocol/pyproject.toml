[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "memory-handoff-bench"
version = "0.2.4"
description = "Reproducible local benchmark for cross-model persistent-memory poisoning in SOC agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Arjun"}]
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "qdrant-client==1.17.1",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
analysis = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "statsmodels>=0.14.4,<1",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
mhb = "memory_handoff_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_handoff_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
