        type: sha256
        value: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        verdict: unknown
      asset: {asset_id: AST-FOR-03, hostname: staging-05.corp.invalid, criticality: medium}
    trusted_fixtures:
      approvals:
        - approval_id: APR-3103
          ioc_value: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
